<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> The entire - Restaurant Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>The entire</h1>
    <p>Fresh food, made with love</p>
  </header>

  <!-- Navigation / category buttons -->
  <nav id="categories">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="starters">Starters</button>
    <button class="filter-btn" data-category="main">Main Course</button>
    <button class="filter-btn" data-category="desserts">Desserts</button>
    <button class="filter-btn" data-category="drinks">Drinks</button>
  </nav>

  <!-- Menu items are added here by script.js -->
  <main id="menu"></main>

  <footer>
    <p>Open daily 11 AM - 11 PM | Made by Arpit Kumar</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
